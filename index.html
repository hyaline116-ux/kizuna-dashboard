  }
  async function openWith(ck) {
    var pt = await unseal(ck.slice(0, 32), ck.slice(32), b2u(KZ_ENC.data));
    if (!pt) return false;
    var html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
    return true;
  }
  async function tryPassword(pw) {
    var base = await S.importKey('raw', new TextEncoder().encode(pw.normalize('NFC')), 'PBKDF2', false, ['deriveBits']);
    var d = new Uint8Array(await S.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b2u(KZ_ENC.salt), iterations: KZ_ENC.iter }, base, 512));
    for (var i = 0; i < KZ_ENC.wraps.length; i++) {
      var ck = await unseal(d.slice(0, 32), d.slice(32), b2u(KZ_ENC.wraps[i]));
      if (ck) return ck;
    }
    return null;
  }
  async function check() {
    var pw = inp.value.trim();
    if (!pw) return;
    btn.disabled = true; err.style.color = 'rgba(34,26,12,.5)'; err.textContent = '解鎖中…';
    try {
      var ck = await tryPassword(pw);
      if (ck) {
        try { localStorage.setItem(CK_KEY, u2b(ck)); } catch (e) {}
        if (await openWith(ck)) return;
      }
      err.style.color = ''; err.textContent = '密碼錯誤';
    } catch (e) { err.style.color = ''; err.textContent = '無法解鎖：' + e.message; }
    btn.disabled = false;
  }
  async function init() {
    try { localStorage.removeItem('kz_auth'); localStorage.removeItem('kz_gh_token'); } catch (e) {}   // 舊版密碼畫面／上傳功能留下的資料
    if (!S) { gate.style.display = ''; err.textContent = '此瀏覽器不支援解密，請改用新版 Safari／Chrome，並確認網址是 https'; btn.disabled = true; return; }
    var saved = null;
    try { saved = localStorage.getItem(CK_KEY); } catch (e) {}
    if (saved) {
      try { if (await openWith(b2u(saved))) return; } catch (e) {}
      try { localStorage.removeItem(CK_KEY); } catch (e) {}   // 密碼已更換 → 重新輸入
    }
    gate.style.display = '';
    btn.addEventListener('click', check);
    inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') check(); });
    inp.focus();
  }
  // 等整頁載入完再開始：document.open() 才會整頁換成解密後的內容，不殘留密碼框
  // （load 事件進行中呼叫 document.open() 會被瀏覽器忽略，所以再用 setTimeout 排到事件之後）
  if (document.readyState === 'complete') setTimeout(init, 0); else window.addEventListener('load', function() { setTimeout(init, 0); });
})();
</script>
</body>
</html>
