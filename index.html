(function() {
  var S = window.crypto && crypto.subtle, CK_KEY = 'kz_ck';
  var gate = document.getElementById('kz-gate'), err = document.getElementById('kz-err'), btn = document.getElementById('kz-go'), inp = document.getElementById('kz-pw');
  function b2u(b) { var s = atob(b), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  function u2b(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }

  async function unseal(ke, km, blob) {

    var pt = await unseal(ck.slice(0, 32), ck.slice(32), b2u(KZ_ENC.data));

  async function tryPassword(pw) {

  }

    if (!S) { gate.style.display = ''; err.textContent = '此瀏覽器不支援解密，請改用新版 Safari／Chrome，並確認網址是 https'; btn.disabled = true; return; }

    inp.focus();
  }
  // 等整頁載入完再開始：document.open() 才會整頁換成解密後的內容，不殘留密碼框
  // （load 事件進行中呼叫 document.open() 會被瀏覽器忽略，所以再用 setTimeout 排到事件之後）
  if (document.readyState === 'complete') setTimeout(init, 0); else window.addEventListener('load', function() { setTimeout(init, 0); });
})();
</script>
</body>
</html>
